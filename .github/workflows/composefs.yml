# The composefs-native variant (README, "composefs backend"): built and
# linted on every pull request and push so it keeps working, never pushed.
# Its bootc comes from updates-testing, so it can also fail on its own.
# Separate from build.yml so neither workflow's changes touch the other.
name: composefs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composefs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-composefs:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in build.yml: btrfs-backed rootful podman storage, current podman and just.
      - uses: projectbluefin/actions/bootc-build/setup-runner@a7e7bba6c7ae819006cabc9a106318c77c2635f8 # v1
        with:
          storage-backend: btrfs
          native-overlay: "true"
          update-podman: "true"
          install-tools: '["just"]'

      - name: Build
        run: sudo -E "$(command -v just)" build-composefs
