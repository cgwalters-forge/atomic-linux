version: 2
updates:
  # Bumps the digest-pinned FROM lines in the Containerfile. Skip releases
  # younger than the cooldown, so a quickly yanked bad push is never proposed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A Fedora release bump (silverblue:44 to :45) is a deliberate change
    # with its own testing, not a digest refresh.
    ignore:
      - dependency-name: fedora-ostree-desktops/silverblue
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
